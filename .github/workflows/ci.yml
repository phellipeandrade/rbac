name: Validate RBAC and deploy documentation

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --coverage=false
      - run: npm run test:package
      - run: npm run examples
      - run: npm pack --dry-run --workspaces
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run typecheck
        working-directory: website
      - run: npm run build
        working-directory: website
      - name: Validate generated localized Pages output
        shell: bash
        run: |
          test -s website/build/index.html
          test -s website/build/pt-BR/index.html
          test -s website/build/docs/intro/index.html
          test -s website/build/pt-BR/docs/intro/index.html
          test -s website/build/docs/api/index.html
          test -s website/build/pt-BR/docs/api/index.html
          test -s website/build/docs/1.x/intro/index.html
          test -s website/build/docs/2.x/intro/index.html
          test -s website/build/pt-BR/docs/1.x/intro/index.html
          test -s website/build/pt-BR/docs/2.x/intro/index.html
          test -s website/build/docs/migration-1-to-2/index.html
          test -s website/build/docs/migration-2-to-3/index.html
          test -s website/build/docs/migration-3-to-4/index.html
          test -s website/build/pt-BR/docs/migration-1-to-2/index.html
          test -s website/build/pt-BR/docs/migration-2-to-3/index.html
          test -s website/build/pt-BR/docs/migration-3-to-4/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: rbac-site-${{ github.sha }}
          path: website/build
          if-no-files-found: error
          retention-days: 14

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rbac-site-${{ github.sha }}
          path: build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
      - id: deployment
        uses: actions/deploy-pages@v4
