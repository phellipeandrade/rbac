    <style>
      body {

      .container {
        box-sizing: border-box;

  <body>
    <div class="container">

    <script>
      const format = (num) => {
        const [whole, fraction] = String(num).split('.')
        const chunked = []
        whole
          .split('')
          .reverse()
          .forEach((char, index) => {
            if (index % 3 === 0) {
              chunked.unshift([char])
            } else {
              chunked[0].unshift(char)
            }
          })

        const fractionStr = fraction !== undefined ? '.' + fraction : ''

        return (
          chunked.map((chunk) => chunk.join('')).join(' ') + fractionStr
        )
      }
      const ctx1787937608642 = document
        .getElementById('chart1787937608642')
        .getContext('2d')
      const chart1787937608642 = new Chart(ctx1787937608642, {
