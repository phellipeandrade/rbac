<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.5.1/dist/chart.min.js"></script>
    <title>RBAC Performance Comparison</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #ddd;
      }

      .container {
        box-sizing: border-box;
        height: 96vh;
        width: 96vw;
        margin: 2vh 2vw;
        resize: both;
        overflow: hidden;
        padding: 20px;
        background: white;
        box-shadow: 0 0 15px #aaa;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <canvas id="chart1794678675414" width="16" height="9"></canvas>
    </div>
    <script>
      const format = (num) => {
        const [whole, fraction] = String(num).split('.')
        const chunked = []
        whole
          .split('')
          .reverse()
          .forEach((char, index) => {
            if (index % 3 === 0) {
              chunked.unshift([char])
            } else {
              chunked[0].unshift(char)
            }
          })

        const fractionStr = fraction !== undefined ? '.' + fraction : ''

        return (
          chunked.map((chunk) => chunk.join('')).join(' ') + fractionStr
        )
      }
      const ctx1794678675414 = document
        .getElementById('chart1794678675414')
        .getContext('2d')
      const chart1794678675414 = new Chart(ctx1794678675414, {
        type: 'bar',
        data: {
          labels: ["@rbac/core - direct permission","@rbac/core - inherited permission","@rbac/core - glob permission","AccessControl - direct permission","AccessControl - inherited permission","AccessControl - admin permission","Popular RBAC - direct permission","Popular RBAC - inherited permission","Popular RBAC - admin permission","Easy RBAC - direct permission","Easy RBAC - inherited permission","Easy RBAC - glob permission","Fast RBAC - direct permission","Fast RBAC - inherited permission","Fast RBAC - glob permission"],
          datasets: [
            {
              data: [7282499,7330012,3982917,943635,668308,568819,209160,201247,198746,6119410,364966,3091113,2989702,2871606,2840481],
              backgroundColor: ["hsl(119.22, 85%, 55%)","hsl(120, 85%, 55%)","hsl(65.208, 85%, 55%)","hsl(15.444000000000004, 85%, 55%)","hsl(10.944000000000006, 85%, 55%)","hsl(9.312000000000006, 85%, 55%)","hsl(3.419999999999993, 85%, 55%)","hsl(3.3, 85%, 55%)","hsl(3.2519999999999922, 85%, 55%)","hsl(100.176, 85%, 55%)","hsl(5.976000000000004, 85%, 55%)","hsl(50.604, 85%, 55%)","hsl(48.948, 85%, 55%)","hsl(47.016, 85%, 55%)","hsl(46.5, 85%, 55%)"],
              borderColor: ["hsl(119.22, 85%, 55%)","hsl(120, 85%, 55%)","hsl(65.208, 85%, 55%)","hsl(15.444000000000004, 85%, 55%)","hsl(10.944000000000006, 85%, 55%)","hsl(9.312000000000006, 85%, 55%)","hsl(3.419999999999993, 85%, 55%)","hsl(3.3, 85%, 55%)","hsl(3.2519999999999922, 85%, 55%)","hsl(100.176, 85%, 55%)","hsl(5.976000000000004, 85%, 55%)","hsl(50.604, 85%, 55%)","hsl(48.948, 85%, 55%)","hsl(47.016, 85%, 55%)","hsl(46.5, 85%, 55%)"],
              borderWidth: 2,
            },
          ],
        },
        options: {
          maintainAspectRatio: false,
          plugins: {
            title: {
              display: true,
              text: 'RBAC Performance Comparison',
              font: { size: 20 },
              padding: 20,
            },
            legend: {
              display: false,
            },
            tooltip: {
              callbacks: {
                label: (context) => {
                  return format(context.parsed.y) + ' ops/s'
                },
              },
              displayColors: false,
              backgroundColor: '#222222',
              padding: 10,
              cornerRadius: 5,
              intersect: false,
            },
          },
          scales: {
            x: {
              grid: {
                color: '#888888',
              },
            },
            y: {
              title: {
                display: true,
                text: 'Operations per second',
                padding: 10,
              },
              grid: {
                color: '#888888',
              },
            },
          },
        },
      })
    </script>
