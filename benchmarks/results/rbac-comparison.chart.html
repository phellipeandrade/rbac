<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.5.1/dist/chart.min.js"></script>
    <title>RBAC Performance Comparison</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #ddd;
      }

      .container {
        box-sizing: border-box;
        height: 96vh;
        width: 96vw;
        margin: 2vh 2vw;
        resize: both;
        overflow: hidden;
        padding: 20px;
        background: white;
        box-shadow: 0 0 15px #aaa;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <canvas id="chart1787937487059" width="16" height="9"></canvas>
    </div>
    <script>
      const format = (num) => {
        const [whole, fraction] = String(num).split('.')
        const chunked = []
        whole
          .split('')
          .reverse()
          .forEach((char, index) => {
            if (index % 3 === 0) {
              chunked.unshift([char])
            } else {
              chunked[0].unshift(char)
            }
          })

        const fractionStr = fraction !== undefined ? '.' + fraction : ''

        return (
          chunked.map((chunk) => chunk.join('')).join(' ') + fractionStr
        )
      }
      const ctx1787937487059 = document
        .getElementById('chart1787937487059')
        .getContext('2d')
      const chart1787937487059 = new Chart(ctx1787937487059, {
        type: 'bar',
        data: {
          labels: ["@rbac/rbac - direct permission","@rbac/rbac - inherited permission","@rbac/rbac - glob permission","AccessControl - direct permission","AccessControl - inherited permission","AccessControl - admin permission","Popular RBAC - direct permission","Popular RBAC - inherited permission","Popular RBAC - admin permission","Easy RBAC - direct permission","Easy RBAC - inherited permission","Easy RBAC - glob permission","Fast RBAC - direct permission","Fast RBAC - inherited permission","Fast RBAC - glob permission"],
          datasets: [
            {
              data: [3798300,3841347,3387220,924795,673490,505774,188150,190566,185137,5357449,320311,2914815,2724425,2461328,2608689],
              backgroundColor: ["hsl(85.08000000000001, 85%, 55%)","hsl(86.04, 85%, 55%)","hsl(75.864, 85%, 55%)","hsl(20.712000000000007, 85%, 55%)","hsl(15.08399999999999, 85%, 55%)","hsl(11.327999999999998, 85%, 55%)","hsl(4.212000000000006, 85%, 55%)","hsl(4.272000000000002, 85%, 55%)","hsl(4.151999999999992, 85%, 55%)","hsl(120, 85%, 55%)","hsl(7.176000000000005, 85%, 55%)","hsl(65.29199999999999, 85%, 55%)","hsl(61.02000000000001, 85%, 55%)","hsl(55.128, 85%, 55%)","hsl(58.428, 85%, 55%)"],
              borderColor: ["hsl(85.08000000000001, 85%, 55%)","hsl(86.04, 85%, 55%)","hsl(75.864, 85%, 55%)","hsl(20.712000000000007, 85%, 55%)","hsl(15.08399999999999, 85%, 55%)","hsl(11.327999999999998, 85%, 55%)","hsl(4.212000000000006, 85%, 55%)","hsl(4.272000000000002, 85%, 55%)","hsl(4.151999999999992, 85%, 55%)","hsl(120, 85%, 55%)","hsl(7.176000000000005, 85%, 55%)","hsl(65.29199999999999, 85%, 55%)","hsl(61.02000000000001, 85%, 55%)","hsl(55.128, 85%, 55%)","hsl(58.428, 85%, 55%)"],
              borderWidth: 2,
            },
          ],
        },
        options: {
          maintainAspectRatio: false,
          plugins: {
            title: {
              display: true,
              text: 'RBAC Performance Comparison',
              font: { size: 20 },
              padding: 20,
            },
            legend: {
              display: false,
            },
            tooltip: {
              callbacks: {
                label: (context) => {
                  return format(context.parsed.y) + ' ops/s'
                },
              },
              displayColors: false,
              backgroundColor: '#222222',
              padding: 10,
              cornerRadius: 5,
              intersect: false,
            },
          },
          scales: {
            x: {
              grid: {
                color: '#888888',
              },
            },
            y: {
              title: {
                display: true,
                text: 'Operations per second',
                padding: 10,
              },
              grid: {
                color: '#888888',
              },
            },
          },
        },
      })
    </script>
  </body>
</html>
