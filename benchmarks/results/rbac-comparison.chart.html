<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.5.1/dist/chart.min.js"></script>
    <title>RBAC Performance Comparison</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #ddd;
      }

      .container {
        box-sizing: border-box;
        height: 96vh;
        width: 96vw;
        margin: 2vh 2vw;
        resize: both;
        overflow: hidden;
        padding: 20px;
        background: white;
        box-shadow: 0 0 15px #aaa;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <canvas id="chart1787938304812" width="16" height="9"></canvas>
    </div>
    <script>
      const format = (num) => {
        const [whole, fraction] = String(num).split('.')
        const chunked = []
        whole
          .split('')
          .reverse()
          .forEach((char, index) => {
            if (index % 3 === 0) {
              chunked.unshift([char])
            } else {
              chunked[0].unshift(char)
            }
          })

        const fractionStr = fraction !== undefined ? '.' + fraction : ''

        return (
          chunked.map((chunk) => chunk.join('')).join(' ') + fractionStr
        )
      }
      const ctx1787938304812 = document
        .getElementById('chart1787938304812')
        .getContext('2d')
      const chart1787938304812 = new Chart(ctx1787938304812, {
        type: 'bar',
        data: {
          labels: ["@rbac/rbac - direct permission","@rbac/rbac - inherited permission","@rbac/rbac - glob permission","AccessControl - direct permission","AccessControl - inherited permission","AccessControl - admin permission","Popular RBAC - direct permission","Popular RBAC - inherited permission","Popular RBAC - admin permission","Easy RBAC - direct permission","Easy RBAC - inherited permission","Easy RBAC - glob permission","Fast RBAC - direct permission","Fast RBAC - inherited permission","Fast RBAC - glob permission"],
          datasets: [
            {
              data: [3802269,3770984,2518709,865821,628971,469278,188293,193710,186259,5678896,334292,2938672,2645436,1288479,2458919],
              backgroundColor: ["hsl(80.34, 85%, 55%)","hsl(79.68, 85%, 55%)","hsl(53.22, 85%, 55%)","hsl(18.3, 85%, 55%)","hsl(13.295999999999998, 85%, 55%)","hsl(9.912000000000006, 85%, 55%)","hsl(3.9839999999999915, 85%, 55%)","hsl(4.091999999999995, 85%, 55%)","hsl(3.9360000000000013, 85%, 55%)","hsl(120, 85%, 55%)","hsl(7.068000000000001, 85%, 55%)","hsl(62.099999999999994, 85%, 55%)","hsl(55.896, 85%, 55%)","hsl(27.227999999999998, 85%, 55%)","hsl(51.96, 85%, 55%)"],
              borderColor: ["hsl(80.34, 85%, 55%)","hsl(79.68, 85%, 55%)","hsl(53.22, 85%, 55%)","hsl(18.3, 85%, 55%)","hsl(13.295999999999998, 85%, 55%)","hsl(9.912000000000006, 85%, 55%)","hsl(3.9839999999999915, 85%, 55%)","hsl(4.091999999999995, 85%, 55%)","hsl(3.9360000000000013, 85%, 55%)","hsl(120, 85%, 55%)","hsl(7.068000000000001, 85%, 55%)","hsl(62.099999999999994, 85%, 55%)","hsl(55.896, 85%, 55%)","hsl(27.227999999999998, 85%, 55%)","hsl(51.96, 85%, 55%)"],
              borderWidth: 2,
            },
          ],
        },
        options: {
          maintainAspectRatio: false,
          plugins: {
            title: {
              display: true,
              text: 'RBAC Performance Comparison',
              font: { size: 20 },
              padding: 20,
            },
            legend: {
              display: false,
            },
            tooltip: {
              callbacks: {
                label: (context) => {
                  return format(context.parsed.y) + ' ops/s'
                },
              },
              displayColors: false,
              backgroundColor: '#222222',
              padding: 10,
              cornerRadius: 5,
              intersect: false,
            },
          },
          scales: {
            x: {
              grid: {
                color: '#888888',
              },
            },
            y: {
              title: {
                display: true,
                text: 'Operations per second',
                padding: 10,
              },
              grid: {
                color: '#888888',
              },
            },
          },
        },
      })
    </script>
