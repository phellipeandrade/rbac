<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.5.1/dist/chart.min.js"></script>
    <title>RBAC Performance Comparison</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #ddd;
      }

      .container {
        box-sizing: border-box;
        height: 96vh;
        width: 96vw;
        margin: 2vh 2vw;
        resize: both;
        overflow: hidden;
        padding: 20px;
        background: white;
        box-shadow: 0 0 15px #aaa;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <canvas id="chart1794654053642" width="16" height="9"></canvas>
    </div>
    <script>
      const format = (num) => {
        const [whole, fraction] = String(num).split('.')
        const chunked = []
        whole
          .split('')
          .reverse()
          .forEach((char, index) => {
            if (index % 3 === 0) {
              chunked.unshift([char])
            } else {
              chunked[0].unshift(char)
            }
          })

        const fractionStr = fraction !== undefined ? '.' + fraction : ''

        return (
          chunked.map((chunk) => chunk.join('')).join(' ') + fractionStr
        )
      }
      const ctx1794654053642 = document
        .getElementById('chart1794654053642')
        .getContext('2d')
      const chart1794654053642 = new Chart(ctx1794654053642, {
        type: 'bar',
        data: {
          labels: ["@rbac/rbac - direct permission","@rbac/rbac - inherited permission","@rbac/rbac - glob permission","AccessControl - direct permission","AccessControl - inherited permission","AccessControl - admin permission","Popular RBAC - direct permission","Popular RBAC - inherited permission","Popular RBAC - admin permission","Easy RBAC - direct permission","Easy RBAC - inherited permission","Easy RBAC - glob permission","Fast RBAC - direct permission","Fast RBAC - inherited permission","Fast RBAC - glob permission"],
          datasets: [

              backgroundColor: ["hsl(75.264, 85%, 55%)","hsl(73.224, 85%, 55%)","hsl(44.952, 85%, 55%)","hsl(16.104000000000003, 85%, 55%)","hsl(18.6, 85%, 55%)","hsl(14.027999999999997, 85%, 55%)","hsl(3.9480000000000075, 85%, 55%)","hsl(4.2360000000000015, 85%, 55%)","hsl(5.783999999999992, 85%, 55%)","hsl(120, 85%, 55%)","hsl(8.483999999999991, 85%, 55%)","hsl(74.076, 85%, 55%)","hsl(57.42, 85%, 55%)","hsl(67.548, 85%, 55%)","hsl(69.97200000000001, 85%, 55%)"],
              borderColor: ["hsl(75.264, 85%, 55%)","hsl(73.224, 85%, 55%)","hsl(44.952, 85%, 55%)","hsl(16.104000000000003, 85%, 55%)","hsl(18.6, 85%, 55%)","hsl(14.027999999999997, 85%, 55%)","hsl(3.9480000000000075, 85%, 55%)","hsl(4.2360000000000015, 85%, 55%)","hsl(5.783999999999992, 85%, 55%)","hsl(120, 85%, 55%)","hsl(8.483999999999991, 85%, 55%)","hsl(74.076, 85%, 55%)","hsl(57.42, 85%, 55%)","hsl(67.548, 85%, 55%)","hsl(69.97200000000001, 85%, 55%)"],
              borderWidth: 2,
            },
          ],
        },
        options: {
          maintainAspectRatio: false,
          plugins: {
            title: {
              display: true,
              text: 'RBAC Performance Comparison',
              font: { size: 20 },
              padding: 20,
            },
            legend: {
              display: false,
            },
            tooltip: {
              callbacks: {
                label: (context) => {
                  return format(context.parsed.y) + ' ops/s'
                },
              },
              displayColors: false,
              backgroundColor: '#222222',
              padding: 10,
              cornerRadius: 5,
              intersect: false,
            },
          },
          scales: {
            x: {
              grid: {

              },
            },
            y: {
              title: {

                text: 'Operations per second',
                padding: 10,
              },

        },
      })
