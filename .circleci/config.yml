version: 2.1

jobs:
  verify:
    docker:
      - image: cimg/node:22.14.0
    working_directory: ~/rbac
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
      - run:
          name: Install locked dependencies
          command: npm ci --no-audit --no-fund
      - save_cache:
          paths:
            - ~/.npm
          key: npm-v1-{{ checksum "package-lock.json" }}
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Typecheck
          command: npm run typecheck
      - run:
          name: Build
          command: npm run build
      - run:
          name: Unit and regression tests
          command: npm test
      - run:
          name: ESM/CommonJS and package exports
          command: npm run test:package
      - run:
          name: Check published package
          command: npm pack --dry-run --workspaces

workflows:
  verify:
    jobs:
      - verify
